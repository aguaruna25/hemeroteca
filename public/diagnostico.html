<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de escritura · Hemeroteca Gamer</title><style>body{font:18px system-ui;background:#080c12;color:#f1f5f9;max-width:650px;margin:10vh auto;padding:24px}input,textarea{box-sizing:border-box;display:block;width:100%;font:inherit;padding:14px;margin:12px 0 24px;background:#121821;color:white;border:1px solid #64748b;border-radius:8px}input:focus,textarea:focus{outline:2px solid #b5e65a}p{color:#b5e65a}</style></head><body><h1>Prueba de escritura</h1><p>Esta página no carga React, TanStack Router ni Supabase. No envía datos.</p><label>Correo<input type="email" placeholder="Escribe aquí un correo de prueba" autocomplete="off"></label><label>Mensaje<textarea rows="4" placeholder="Escribe un mensaje de prueba"></textarea></label><p id="estado">Prueba haciendo clic y escribiendo en ambos campos.</p><script>document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',()=>{document.getElementById('estado').textContent='La escritura funciona: '+new Date().toLocaleTimeString()}))</script></body></html>
